worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        # ---- Viewer page ----
        location /viewer/ {
            alias "E:/Streaming Service Project/OTT-From-Scratch-Crafts/viewer/";
            index index.html;
            add_header Access-Control-Allow-Origin *;
        }

        # ---- HLS segments (per-stream subdirectories) ----
        location /hls/ {
            alias "E:/Streaming Service Project/OTT-From-Scratch-Crafts/hls/";
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            location ~* \.m3u8$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Access-Control-Allow-Origin *;
            }

            location ~* \.ts$ {
                add_header Cache-Control "public, max-age=10";
                add_header Access-Control-Allow-Origin *;
            }
        }

        # ---- inputs.json (stream config for viewer) ----
        location = /inputs.json {
            alias "E:/Streaming Service Project/OTT-From-Scratch-Crafts/config/inputs.json";
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            default_type application/json;
        }
    }
}
