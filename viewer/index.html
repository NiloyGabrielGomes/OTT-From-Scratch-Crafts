<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="container-fluid">
        <ul><li><strong>&#127909; STREAM VIEWER</strong></li></ul>
        <ul>
            <li id="mode-live" class="mode-tab active" data-mode="live">&#128308; Live</li>
            <li id="mode-vod" class="mode-tab" data-mode="vod">&#127916; VOD</li>
        </ul>
    </nav>

    <main class="container-fluid">
        <!-- Live section -->
        <section id="live-section">
            <div class="tabs" id="tabs"></div>
            <figure>
                <video id="video" controls autoplay muted></video>
            </figure>
            <div id="status" class="status-bar loading">Loading streams...</div>
            <small id="info" class="stream-info"></small>
        </section>

        <!-- VOD section -->
        <section id="vod-section" class="hidden">
            <!-- VOD player -->
            <div id="vod-player-area" class="hidden">
                <a href="#" id="vod-back" role="button" class="outline secondary">&#8592; Back to library</a>
                <figure id="vod-figure">
                    <video id="vod-video" controls></video>
                </figure>
                <div id="vod-status" class="status-bar"></div>
                <small id="vod-info" class="stream-info"></small>
            </div>
            <!-- VOD library -->
            <div id="vod-library">
                <div class="grid" id="vod-grid"></div>
                <div id="vod-empty" class="hidden">
                    <article>
                        <p>No VOD videos available yet.<br>Record a stream first.</p>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="container-fluid">
        <small>HLS.js &middot; Live &amp; VOD &middot; <a href="/monitor/">Monitor</a></small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
