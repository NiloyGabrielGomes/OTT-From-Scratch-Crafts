# ============================================================
#  MediaMTX configuration — RTMP relay only
#  Receives RTMP from OBS, re-publishes for FFmpeg to consume
#
#  runOnReady calls ffmpeg-start.bat when OBS publishes.
#  FFmpeg settings live in inputs.json (single source of truth).
# ============================================================

# --- Server protocols ---
rtmp: yes
rtmpAddress: :1935
hls: no
rtsp: no
srt: no

# --- WebRTC (low-latency monitoring) ---
webrtc: yes
webrtcAddress: :8889

# --- REST API ---
api: yes
apiAddress: :9999

# --- Paths ---
# runOnReady fires when OBS starts publishing to a path.
# Terminated (FFmpeg killed) when OBS disconnects.

paths:
  live/cam1:
    runOnReady: cmd /c "E:\Streaming Service Project\OTT-From-Scratch-Crafts\ffmpeg\ffmpeg-start.bat" cam1
    runOnReadyRestart: yes

  live/cam2:
    runOnReady: cmd /c "E:\Streaming Service Project\OTT-From-Scratch-Crafts\ffmpeg\ffmpeg-start.bat" cam2
    runOnReadyRestart: yes

  live/screen:
    runOnReady: cmd /c "E:\Streaming Service Project\OTT-From-Scratch-Crafts\ffmpeg\ffmpeg-start.bat" screen
    runOnReadyRestart: yes
